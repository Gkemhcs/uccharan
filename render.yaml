services:
  - type: web
    name: uccharan-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # set manually in the Render dashboard — never committed
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        value: "*" # Android apps don't send an Origin header; this is safe to leave open here
